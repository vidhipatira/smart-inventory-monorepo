version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: smartinventory-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartinventorydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./apps/backend-dotnet-api/BackendApi
      dockerfile: Dockerfile
    container_name: smartinventory-backend
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=smartinventorydb;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./apps/frontend-angular-nx
      dockerfile: Dockerfile
    container_name: smartinventory-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres_data:
